        display: flex;
        justify-content: center;
        padding: 30px 16px 30px;
        position: relative;
    }

    #particles-js {

        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        z-index: 0;
        pointer-events: none;
    }

    /* subtle radial glow behind everything */
    body::before {
        content: '';
        position: fixed;
        top: -10%;
        left: 50%;
        transform: translateX(-50%);
        width: 700px;
        height: 700px;
        background: radial-gradient(circle, rgba(59,130,246,0.18) 0%, rgba(5,8,22,0) 70%);
        z-index: 0;
        pointer-events: none;
    }

    .page {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 760px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* ===== Profile header ===== */
    .profile-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 30px;
        text-align: center;
    }

    .avatar-ring {
        width: 130px;
        height: 130px;
        border-radius: 50%;
        padding: 4px;
        background: linear-gradient(135deg, #0612b9, #086aea, #3b82f6);
        box-shadow: 0 0 30px rgba(8, 106, 234, 0.5);
        margin-bottom: 18px;
        position: relative;
        animation: pulseGlow 3.5s ease-in-out infinite;
    }

    @keyframes pulseGlow {
        0%, 100% { box-shadow: 0 0 25px rgba(8, 106, 234, 0.4); }
        50% { box-shadow: 0 0 42px rgba(59, 130, 246, 0.65); }
    }

    .avatar-ring img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        display: block;
        background: #111827;
        border: 3px solid #050816;
    }

    .profile-name {
        font-size: 2rem;
        font-weight: 900;
        background: linear-gradient(45deg, #ffffff, #c3dafe);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 6px;
        letter-spacing: 0.5px;
    }

    /* ===== Links list ===== */
    .links-list {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        margin-bottom: 36px;
    }

    .link-card {
        position: relative;
        display: flex;
        align-items: center;
        gap: 16px;
        width: 100%;
        text-decoration: none;
        color: #fff;
        background: rgba(10, 17, 40, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        padding: 18px 22px;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        overflow: hidden;
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .link-card::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(59,130,246,0.12), transparent 60%);
        opacity: 0;
        transition: opacity 0.35s ease;
    }

    .link-card:hover {
        transform: translateY(-4px);
        border-color: rgba(59, 130, 246, 0.4);
        box-shadow: 0 12px 28px rgba(59, 130, 246, 0.18);
    }

    .link-card:hover::before { opacity: 1; }

    .link-icon {
        flex-shrink: 0;
        width: 46px;
        height: 46px;
        border-radius: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.3rem;
        position: relative;
        z-index: 1;
    }

    .link-icon img { width: 24px; height: 24px; object-fit: contain; }
    .link-icon svg { width: 22px; height: 22px; }

    .link-card.kick .link-icon,
    .social-icon.kick {
        background: #ffffff;
        border: 1.5px solid rgba(83, 252, 24, 0.55);
    }

    .link-card.kick .link-icon img,
    .social-icon.kick img {
        width: 60%;
        height: 60%;
        object-fit: contain;
    }

    .link-body {
        flex-grow: 1;
        min-width: 0;
        position: relative;
        z-index: 1;
        text-align: right;
    }

    .link-title {
        font-size: 1.1rem;
        font-weight: 700;
        margin-bottom: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;

    .link-sub {
        font-size: 0.82rem;
        color: #929dae;
        direction: ltr;
        text-align: right;
        white-space: nowrap;
        overflow: hidden;

    .link-arrow {

        font-weight: 900;
        opacity: 0;

        position: relative;
        z-index: 1;

        transform: translateX(0);
